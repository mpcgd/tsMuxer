name: Build for Mac Native

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-mac-native:

    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@master
      name: checkout
      
    - run: brew install qt@5
      name: Install Qt5 via Homebrew
      
    - run: export PATH="/opt/homebrew/opt/qt@5/bin:$PATH" && ./scripts/build_macos_native.sh
      name: build-for-mac-arm64

    - uses: actions/upload-artifact@master
      with:
         name: tsMuxer_mac_arm64
         path: build/bin/mac_arm64.zip
      name: upload-artefact
