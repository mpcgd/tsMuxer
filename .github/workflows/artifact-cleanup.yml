name: Cleanup Old Artifacts

on:
  schedule:
    # Run daily at 2 AM UTC to clean up old artifacts
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
    # Deletes artifacts via the REST API rather than a third-party action.
    # geekyeggo/delete-artifact has no minCreatedAt input in ANY version and its
    # older versions talk to the run-runtime endpoint, which fails on scheduled
    # runs ("Failed to load artifacts"). The REST API below lists all repo
    # artifacts, keeps the last 30 days, and deletes the rest.
    - name: Delete artifacts older than 30 days
      uses: actions/github-script@v7
      with:
        script: |
          const cutoff = new Date();
          cutoff.setDate(cutoff.getDate() - 30);

          const { owner, repo } = context.repo;
          let deleted = 0;
          let skipped = 0;
          let page = 1;
          let total = Infinity;

          while ((page - 1) * 100 < total) {
            const response = await github.rest.actions.listArtifactsForRepo({
              owner,
              repo,
              per_page: 100,
              page,
            });

            total = response.data.total_count;
            for (const artifact of response.data.artifacts) {
              if (new Date(artifact.created_at) <= cutoff) {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
                core.info(`Deleted artifact "${artifact.name}" (created ${artifact.created_at})`);
                deleted++;
              } else {
                skipped++;
              }
            }
            page++;
          }

          core.info(`Cleanup finished: ${deleted} artifact(s) deleted, ${skipped} kept (created within the last 30 days).`);

    - name: Log cleanup completion
      run: |
        echo "::notice::Artifact cleanup completed - removed artifacts older than 30 days"
